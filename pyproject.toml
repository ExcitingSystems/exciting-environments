[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exciting_environments"
version = "0.3.1"
authors = [
  { name="Oliver Schweins", email="oliverjs@mail.uni-paderborn.de" },
  { name="Hendrik Vater", email="vater@lea.uni-paderborn.de" },
]
description = "Physical differential equations wrapped into Gymnasium environments"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "matplotlib>=3.10.8",
    "jax>=0.9.0",
    "chex>=0.1.91",
    "diffrax>=0.7.0",
    "mujoco>=3.12.0",
    "mujoco-mjx>=3.12.0",
]

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]>=0.9.0"
]
cuda13 = [
    "jax[cuda13]>=0.9.0"
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[project.urls]
"Homepage" = "https://excitingsystems.github.io/exciting-environments/"

[tool.hatch.build.targets.wheel]
packages = ["exciting_environments"]
artifacts = ["*.mat"]

[tool.black]
line-length = 120
